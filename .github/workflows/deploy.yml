name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-main-worker:
    name: Deploy Main Scraper & Telegram Bot Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Prepare Cloudflare Credentials
        run: |
          node -e '
            const rawToken = process.env.RAW_TOKEN || "";
            const rawAccountId = process.env.RAW_ACCOUNT_ID || "";
            const cleanToken = rawToken
              .replace(/^(bearer|cloudflare_api_token=)\s*/i, "")
              .replace(/^["'"'"']|["'"'"']$/g, "")
              .trim();
            const cleanAccountId = rawAccountId
              .replace(/^cloudflare_account_id=\s*/i, "")
              .replace(/^["'"'"']|["'"'"']$/g, "")
              .trim();

            console.log("Cleaned Token length:", cleanToken.length);
            console.log("Cleaned Account ID length:", cleanAccountId.length);

            if (!cleanToken) {
              console.error("ERROR: CLOUDFLARE_API_TOKEN is empty! Please set it in GitHub Secrets.");
              process.exit(1);
            }
            if (!cleanAccountId) {
              console.error("ERROR: CLOUDFLARE_ACCOUNT_ID is empty! Please set it in GitHub Secrets.");
              process.exit(1);
            }

            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${cleanToken}\nCLOUDFLARE_ACCOUNT_ID=${cleanAccountId}\n`);
          '
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Main Worker to Cloudflare
        run: npx wrangler deploy

  deploy-download-worker:
    name: Deploy Dedicated Download Page Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: download-worker
        run: npm install

      - name: Prepare Cloudflare Credentials
        run: |
          node -e '
            const rawToken = process.env.RAW_TOKEN || "";
            const rawAccountId = process.env.RAW_ACCOUNT_ID || "";
            const cleanToken = rawToken
              .replace(/^(bearer|cloudflare_api_token=)\s*/i, "")
              .replace(/^["'"'"']|["'"'"']$/g, "")
              .trim();
            const cleanAccountId = rawAccountId
              .replace(/^cloudflare_account_id=\s*/i, "")
              .replace(/^["'"'"']|["'"'"']$/g, "")
              .trim();

            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${cleanToken}\nCLOUDFLARE_ACCOUNT_ID=${cleanAccountId}\n`);
          '
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Download Worker to Cloudflare
        working-directory: download-worker
        run: npx wrangler deploy
