name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-main-worker:
    name: Deploy Main Scraper & Telegram Bot Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Deploy Main Worker to Cloudflare
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n[:space:]')
          CLEAN_ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '\r\n[:space:]')
          CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CLEAN_ACCOUNT_ID" npx wrangler deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-download-worker:
    name: Deploy Dedicated Download Page Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: download-worker
        run: npm install

      - name: Deploy Download Worker to Cloudflare
        working-directory: download-worker
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n[:space:]')
          CLEAN_ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '\r\n[:space:]')
          CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CLEAN_ACCOUNT_ID" npx wrangler deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
